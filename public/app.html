<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f4ef"><meta name="description" content="팀플이냐 팀킬이냐 — 대화와 생각, 할 일과 다음 모임을 이어가는 팀 공간"><title>Team Chats · 팀플이냐 팀킬이냐</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/app.css"><link rel="stylesheet" href="/desktop.css?v=pc-1"></head><body>
<a class="skip" href="#messageInput">메시지 입력으로 바로가기</a>
<div class="app-shell"><nav class="rail" aria-label="주 메뉴"><a class="rail-button home-link" href="/" title="홈" aria-label="홈"><span data-icon="home"></span></a><div class="rail-main"><button class="rail-button active" data-view="chat" title="팀 대화" aria-label="팀 대화" aria-current="page"><span data-icon="send"></span></button><button class="rail-button" id="scheduleNav" title="일정 투표" aria-label="일정 투표"><span data-icon="calendar"></span></button><button class="rail-button" id="tasksNav" title="팀 할 일" aria-label="팀 할 일"><span data-icon="tasks"></span><span class="rail-count" id="myTaskCount" hidden>0</span></button><button class="rail-button" data-view="brainstorm" title="브레인스토밍" aria-label="브레인스토밍"><span data-icon="star"></span></button></div><button class="rail-button profile-trigger" id="userMenu" title="사용자 설정" aria-label="사용자 설정" aria-expanded="false" aria-controls="userPopover"><span data-icon="user"></span><span class="presence-dot"></span></button></nav>
<div class="workspace-frame"><aside class="side" id="sidebar" aria-label="팀 회의실과 할 일"><div class="sidebar-title"><h1>Team Chats</h1><button class="square-button lime-outline" id="newChannel" aria-label="팀 선택 또는 새 팀 만들기" title="새 팀 만들기"><span data-icon="plus"></span></button><button class="square-button mobile-sidebar-close" id="closeSidebar" aria-label="회의실 목록 닫기"><span data-icon="close"></span></button></div><label class="search-field"><span data-icon="search"></span><input id="roomSearch" type="search" placeholder="search" aria-label="회의실 검색" autocomplete="off"></label><div class="side-divider"></div><button class="team-picker" id="teamMenu" title="팀 선택 · 새 팀 만들기"><span id="workspaceName">팀 공간 불러오는 중</span><span data-icon="chevron-down"></span></button><div class="room-list" id="channelList" aria-label="내 팀 회의실"><p class="empty-list">회의실을 불러오고 있어요.</p></div><section class="sidebar-tasks" id="tasks" aria-label="팀 할 일"><div class="side-divider"></div><header class="tasks-heading"><button id="focusTasks" title="전체 할 일과 내 할 일 전환"><span data-icon="check-square"></span><span>할 일</span><small id="taskHeaderCount">0</small></button><button class="square-button" id="addTaskButton" aria-label="할 일 추가" title="할 일 추가"><span data-icon="plus-square"></span></button></header><div class="task-list" id="taskList"><p class="empty-list">아직 등록된 할 일이 없어요.</p></div><p class="task-progress" id="progressLabel">0 / 0 완료</p></section></aside>
<main class="main" id="chat"><header class="channel-head"><div class="channel-heading"><button class="square-button mobile-menu" id="openSidebar" aria-label="회의실 목록 열기"><span data-icon="menu"></span></button><div class="channel-heading-text"><h2 id="teamName">팀 회의실</h2><div class="channel-subtitle"><span id="viewLabel">채팅방</span><span class="subtitle-dot">·</span><label class="sr-only" for="channelPicker">대화 채널 선택</label><select id="channelPicker" aria-label="대화 채널 선택"><option>불러오는 중</option></select><span class="sr-only" id="channelName">팀 대화</span><span class="sr-only" id="channelMeta"></span></div></div></div><div class="header-actions"><button class="member-button" id="membersButton" aria-label="팀원 보기" title="팀원 보기"><span class="avatar-stack" id="memberAvatars"></span></button><button class="outline-button" id="inviteButton" aria-label="초대"><span data-icon="plus"></span><span>초대</span></button><button class="outline-button summary-trigger" id="summaryButton" aria-label="회의 정리"><span data-icon="document"></span><span>회의 정리</span></button><button class="square-button header-search" id="searchButton" title="대화 검색" aria-label="대화 검색"><span data-icon="search"></span></button></div></header><div class="notice" id="notice" hidden><span data-icon="spark"></span><span>명확한 담당·기한 약속은 할 일로 이어지고, 사진과 과제 파일도 팀 공간에 보관돼요.</span><button class="square-button" id="noticeClose" aria-label="안내 닫기"><span data-icon="close"></span></button></div><section class="pinned-polls" id="schedule" aria-label="일정 투표" hidden><div id="pollList"></div></section><section class="chat-scroll" id="chatScroll" aria-label="팀 대화"><div id="messageList"><p class="loading-message">팀의 대화를 불러오고 있어요.</p></div></section>
<section class="brainstorm-view" id="brainstormView" aria-label="브레인스토밍 생각 지도" hidden><div class="brainstorm-top"><span><span class="live-dot"></span>대화에서 이어지는 우리 팀의 생각</span><button class="text-button" id="brainstormHelp">사용법</button></div><div class="mindmap-viewport" id="mindmapViewport"><div class="mindmap-canvas" id="mindmapCanvas"></div></div><div class="mindmap-toolbar"><p id="mindmapHint">생각을 선택하고 새로운 가지를 이어보세요.</p><div class="map-controls"><button id="mapZoomOut" aria-label="생각 지도 축소"><span data-icon="minus"></span></button><span id="mapZoomLabel">100%</span><button id="mapZoomIn" aria-label="생각 지도 확대"><span data-icon="plus"></span></button><button id="mapFit" aria-label="생각 지도 전체 보기" title="전체 보기"><span data-icon="fit"></span></button></div></div></section>
<form class="compose" id="composeForm"><div class="compose-box"><div class="compose-tools"><button class="square-button" type="button" id="emojiButton" aria-label="이모지 넣기" title="이모지"><span data-icon="smile"></span></button><button class="square-button" type="button" id="uploadButton" aria-label="사진이나 과제 파일 올리기" title="사진·파일 올리기"><span data-icon="upload"></span></button><input type="file" id="fileInput" multiple hidden accept="image/jpeg,image/png,image/webp,image/gif,application/pdf,.jpg,.jpeg,.png,.webp,.gif,.pdf,.hwp,.hwpx,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.csv"></div><textarea id="messageInput" rows="1" placeholder="메시지를 입력하세요." aria-label="메시지 입력" maxlength="2000"></textarea><button class="send-button" id="sendButton" type="submit" aria-label="메시지 보내기" title="메시지 보내기"><span data-icon="arrow"></span></button></div><div class="compose-hint"><span>Enter로 보내기 · Shift + Enter로 줄 바꾸기</span><button type="button" id="taskShortcut">할 일 만들기</button><span class="sync-label">팀원에게 동기화되는 공간</span></div></form></main></div></div>
<div class="sidebar-scrim" id="sidebarScrim" hidden></div><section class="user-popover" id="userPopover" aria-label="사용자 설정" hidden><header><strong>상태 설정</strong><span class="online-label"><i></i>온라인</span></header><div class="work-status-row"><label for="workStatus">내 업무 상태</label><select id="workStatus"><option value="available">업무 확인했어요</option><option value="needs_adjustment">일정 조정이 필요해요</option><option value="away">잠시 부재 중이에요</option></select><button class="square-button" id="statusSave" aria-label="팀에 상태 알리기" title="상태 저장"><span data-icon="check"></span></button></div><div class="profile-info"><span class="sr-only" id="meAvatar">나</span><span id="meName">내 계정</span><span id="statusMember"></span><button class="text-button" id="showNotice">사용 안내</button></div><a class="signout-link" id="signoutLink" href="/signout-with-chatgpt?return_to=%2Flogin%2F" target="_top">로그아웃<span data-icon="logout"></span></a></section>
<div class="toast" role="status" aria-live="polite"></div><div class="modal-back" id="modalBack" hidden><section class="modal" id="modalPanel" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><header class="modal-header"><h2 id="modalTitle"></h2><button class="square-button modal-x" id="modalX" aria-label="닫기"><span data-icon="close"></span></button></header><p id="modalIntro" hidden></p><div class="modal-body" id="modalBody"></div><footer class="modal-actions"><button class="outline-button" id="modalClose">닫기</button><button class="primary-button" id="modalConfirm" hidden>확인</button></footer></section></div><script src="/client.js" defer></script></body></html>
